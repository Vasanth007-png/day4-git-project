name: Java Maven CI

on:
  push:
    branches:
      - main
      - feature-login
      - feature-dashboard

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn clean test

      - name: Package application
        run: mvn package
