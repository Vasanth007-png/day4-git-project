---
- name: Configure application server
  hosts: app
  become: true

  roles:
    - docker 

  tasks:
    - name: Update dnf package cache
      ansible.builtin.dnf:
        update_cache: true

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - git
          - docker
        state: present

    - name: Start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/myapp
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Clone application repository
      ansible.builtin.git:
        repo: "https://github.com/Vasanth007-png/day4-git-project.git"
        dest: /opt/myapp
        version: main
